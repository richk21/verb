services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping').ok", '--quiet']
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - verb-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # Overrides whatever MONGO_URI is in .env — inside the compose
      # network, Mongo is reachable by service name, not localhost.
      - MONGO_URI=mongodb://mongo:27017/verb
    ports:
      - '5000:5000'
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - verb-network

  frontend:
    build:
      context: ./verb
      dockerfile: Dockerfile
      args:
        REACT_APP_BACKEND_URL: http://localhost:5000
    restart: unless-stopped
    ports:
      - '3000:80'
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - verb-network

networks:
  verb-network:
    driver: bridge

volumes:
  mongo-data:
