server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: any path not matching a real static file goes to
    # index.html so React Router's client-side routing handles it —
    # without this, refreshing on /report/123 returns nginx's 404,
    # not your app.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long cache for hashed static assets (CRA fingerprints filenames on
    # build), but never cache index.html itself, or a redeployed app can
    # get stuck showing a stale shell referencing deleted JS chunks.
    location ~* \.(?:js|css|png|jpg|jpeg|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
}